# Dedicated hostname. The listener on 8091 remains loopback-only.
server {
    listen 80;
    server_name __DOMAIN__;
    return 308 https://__DOMAIN__$request_uri;
}
server {
    listen 443 ssl;
    server_name __DOMAIN__;
    ssl_certificate __CERTIFICATE__;
    ssl_certificate_key __CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128m;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;

    location / {
        # HttpListener checks the registered loopback Host, not the public name.
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host 127.0.0.1:__PORT__;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Buffer slow uploads before occupying the map service's single worker.
        proxy_request_buffering on;
        # Drain downloads promptly so slow clients do not occupy that worker.
        proxy_buffering on;
    }
}
