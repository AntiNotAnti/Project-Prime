name: authoritative impact contracts
on:
  pull_request:
    paths:
      - 'src/MphRead/**'
      - 'tools/nettest/**'
      - 'tools/live-impact/**'
      - '.github/workflows/live-impact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset-free:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tools/nettest -c Release -- --impact-baseline
      - run: dotnet run --project tools/nettest -c Release --no-build -- --live-impact
      - run: dotnet run --project tools/nettest -c Release --no-build -- --impact-transport
      - run: dotnet run --project tools/nettest -c Release --no-build -- --impact-crossview
      - run: dotnet run --project tools/nettest -c Release --no-build -- --impact-claim-fastpath
      - run: dotnet run --project tools/nettest -c Release --no-build -- --impact-visual-kills
      - run: dotnet run --project tools/nettest -c Release --no-build -- --impact-profile
      - run: python3 tools/live-impact/run-validation.py --output artifacts/live-impact
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-impact-evidence-${{ matrix.os }}
          path: artifacts/live-impact
