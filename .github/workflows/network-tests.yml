name: network tests

on:
  push:
    branches: ["**"]
    paths:
      - '.github/workflows/**'
      - '.editorconfig'
      - 'Directory.*'
      - 'Game.sln'
      - 'global.json'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'maps/**'
      - 'build/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.editorconfig'
      - 'Directory.*'
      - 'Game.sln'
      - 'global.json'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'maps/**'
      - 'build/**'
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-prime-network-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-fast:
    name: lifecycle-fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: content-free lifecycle fast tests
        run: >
          dotnet test tests/Server.Node.Tests/Server.Node.Tests.csproj -c Release
          --filter "LifecycleFast=true&RequiresGameContent!=true"
      - name: shared lifecycle fast tests
        run: >
          dotnet test tests/Server.Shared.Tests/Server.Shared.Tests.csproj -c Release
          --filter "LifecycleFast=true&RequiresGameContent!=true"
      - name: Worker artifact lifecycle fast tests
        run: >
          dotnet test tests/Server.Worker.Tests/Server.Worker.Tests.csproj -c Release
          --filter "LifecycleFast=true&RequiresGameContent!=true"
      - name: client codec lifecycle fast tests
        run: >
          dotnet test tests/Tests/Tests.csproj -c Release
          --filter "LifecycleFast=true&RequiresGameContent!=true"

  lifecycle-vertical:
    name: lifecycle-vertical
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: real Node Worker UDP lifecycle tests when content is supplied
        env:
          GAME_DATA_DIRECTORY: ${{ secrets.GAME_DATA_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -z "${GAME_DATA_DIRECTORY:-}" ]; then
            echo "GAME_DATA_DIRECTORY is not configured; lifecycle vertical tests were not run."
          else
            dotnet test tests/Server.Node.Tests/Server.Node.Tests.csproj -c Release \
              --filter "LifecycleVertical=true&RequiresGameContent=true"
          fi

  lifecycle-stress:
    name: lifecycle-stress
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: content-free continuation stress
        run: >
          dotnet test tests/Server.Node.Tests/Server.Node.Tests.csproj -c Release
          --filter "LifecycleStress=true&RequiresGameContent!=true"
      - name: content-backed automatic rematch stress when content is supplied
        env:
          GAME_DATA_DIRECTORY: ${{ secrets.GAME_DATA_DIRECTORY }}
          LIFECYCLE_STRESS_ROUNDS: '50'
        run: |
          set -euo pipefail
          if [ -z "${GAME_DATA_DIRECTORY:-}" ]; then
            echo "GAME_DATA_DIRECTORY is not configured; content-backed lifecycle stress was not run."
          else
            dotnet test tests/Server.Node.Tests/Server.Node.Tests.csproj -c Release \
              --filter "LifecycleStress=true&RequiresGameContent=true"
          fi

  map-platform:
    name: integration-map-platform
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: map package, identity, catalog, compiler, scheduler, and editor tests
        run: >
          dotnet test tests/MapPlatform.Tests/MapPlatform.Tests.csproj -c Release
          --filter "RequiresGameContent!=true"
      - name: map characterization tests when authoritative content is supplied
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        env:
          GAME_DATA_DIRECTORY: ${{ secrets.GAME_DATA_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -z "${GAME_DATA_DIRECTORY:-}" ]; then
            echo "GAME_DATA_DIRECTORY is not configured; content-free map platform verification completed."
          else
            dotnet test tests/MapPlatform.Tests/MapPlatform.Tests.csproj -c Release \
              --filter "RequiresGameContent=true"
          fi

  protocol:
    name: integration-network-and-server
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Backend integration boundary is opt-in locally through
    # PRIME_TEST_POSTGRES_FILE. CI supplies the same private connection-file
    # contract against an isolated service, so the PostgreSQL cases exercise
    # the real migration, transaction, concurrency, and role boundaries.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prime-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: project boundaries and multiplayer source guards
        run: |
          python3 tools/check-project-boundaries.py
          python3 tools/check-multiplayer-only.py
          python3 tools/check-current-protocol.py
      - name: direct Game compile
        run: dotnet build src/Game/Game.csproj -c Release --artifacts-path artifacts/game
      - name: protocol and UDP safety tests (content-free)
        run: dotnet test tests/Tests/Tests.csproj -c Release --filter "RequiresGameContent!=true"
      - name: extracted replay tests
        run: dotnet test tests/Replay.Tests/Replay.Tests.csproj -c Release
      - name: fidelity fixture and manifest smoke tests
        run: >
          dotnet test tests/Tests/Tests.csproj -c Release --no-build
          --filter "Category=FidelitySmoke&RequiresGameContent!=true"
      - name: Server.Shared contract tests
        run: dotnet test tests/Server.Shared.Tests/Server.Shared.Tests.csproj -c Release
      - name: Server.Worker runtime build
        run: dotnet build src/Server.Worker/Server.Worker.csproj -c Release
      - name: Server.Worker tests (content-free)
        run: >
          dotnet test tests/Server.Worker.Tests/Server.Worker.Tests.csproj -c Release
          --filter "RequiresGameContent!=true"
      - name: Server.Worker authoritative tests (when content is supplied)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        env:
          GAME_DATA_DIRECTORY: ${{ secrets.GAME_DATA_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -z "${GAME_DATA_DIRECTORY:-}" ]; then
            echo "GAME_DATA_DIRECTORY is not configured; content-backed Worker tests were not run."
          else
            dotnet test tests/Server.Worker.Tests/Server.Worker.Tests.csproj -c Release \
              --filter "RequiresGameContent=true"
          fi
      - name: cook map artifacts once for the server package
        run: |
          tools/cook-maps.sh --source maps --output artifacts/maps/current \
            --configuration Release --compiler-version "$GITHUB_SHA" \
            --schema-version 1 --package-version "$GITHUB_SHA"
      - name: package the Backend, Node and Worker bundle
        run: |
          tools/package-server.sh --rid linux-x64 --skip-map-cook \
            --map-artifacts "$GITHUB_WORKSPACE/artifacts/maps/current" \
            --output artifacts/server-linux-x64
      - name: server bundle structural checks
        run: |
          set -euo pipefail
          test -x artifacts/server-linux-x64/backend/ProjectPrime.Backend
          test -x artifacts/server-linux-x64/ProjectPrimeServer
          test -x artifacts/server-linux-x64/start-stack-dev.sh
          test -x artifacts/server-linux-x64/worker/ProjectPrime.Server.Worker
          test -f artifacts/server-linux-x64/server.example.json
          ! find artifacts/server-linux-x64 -maxdepth 1 -type f -name 'ProjectPrime.Server.Worker*' | grep -q .
          tools/check-no-game-assets.sh artifacts/server-linux-x64
      - name: Server.Node runtime build
        run: dotnet build src/Server.Node/Server.Node.csproj -c Release
      - name: Server.Node content-free lifecycle tests
        # The two real Worker vertical tests require extracted, untracked AMHE1
        # content. They run in the focused real-process validation instead.
        run: >
          dotnet test tests/Server.Node.Tests/Server.Node.Tests.csproj -c Release
          --filter "RequiresGameContent!=true"
      - name: prepare the opt-in PostgreSQL connection file
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' 'Host=localhost;Port=5432;Username=postgres;Password=prime-ci-only;Database=postgres' \
            > "$RUNNER_TEMP/prime-postgres-connection.txt"
          test "$(stat -c '%a' "$RUNNER_TEMP/prime-postgres-connection.txt")" = 600
      - name: Backend tests with the existing PostgreSQL boundary
        env:
          PRIME_TEST_POSTGRES_FILE: ${{ runner.temp }}/prime-postgres-connection.txt
        run: dotnet test tests/Backend.Tests/Backend.Tests.csproj -c Release
      - name: isolated imaging tests
        run: dotnet test tests/Imaging/Imaging.Tests.csproj -c Release
      - name: network and deployment tooling tests
        run: |
          set -euo pipefail
          # The legacy updater builder remains an explicit operator migration
          # tool and is intentionally outside the public bundle CI path.
          while IFS= read -r test; do
            case "$test" in
              tools/tests/test_server_update_package.py) continue ;;
            esac
            python3 -m unittest discover -s tools/tests -p "$(basename "$test")" -v
          done < <(find tools/tests -maxdepth 1 -type f -name 'test_*.py' | sort)
      - name: build authoritative server and authoritative conformance harness
        run: dotnet build tools/nettest/nettest.csproj -c Release -o artifacts/nettest

      # This is a scheduled/manual observation because it is deliberately
      # separate from the correctness gates. The source metrics come from the
      # existing nettest harness; the Python layer only records environment
      # metadata and compares a committed JSON baseline report-only.
      - name: performance baseline observation (advisory)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/perf
          set +e
          dotnet artifacts/nettest/nettest.dll \
            --performance-baseline artifacts/perf/nettest.json \
            > artifacts/perf/nettest.log 2>&1
          nettest_status=$?
          set -e
          cat artifacts/perf/nettest.log
          python3 - "$nettest_status" artifacts/perf/nettest.json <<'PY'
          import json
          import sys

          status = int(sys.argv[1])
          report_path = sys.argv[2]
          expected_content_gaps = {
              "SnapshotState.CaptureServerState",
              "HistoricalCollisionQueryEngine.TryQuery",
              "WorldStateCapture.Capture",
          }
          try:
              with open(report_path, encoding="utf-8") as handle:
                  report = json.load(handle)
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f"nettest performance report is unavailable: {error}")

          scenarios = report.get("Scenarios")
          if not isinstance(scenarios, list):
              raise SystemExit("nettest performance report has no Scenarios array")
          gap_names = {
              scenario.get("Name") for scenario in scenarios
              if isinstance(scenario, dict) and scenario.get("Status") == "gap"
          }
          unexpected = [
              scenario.get("Name", "<unnamed>")
              for scenario in scenarios
              if not isinstance(scenario, dict) or scenario.get("Status") not in {"ok", "gap"}
          ]
          if unexpected or (status != 0 and gap_names != expected_content_gaps):
              raise SystemExit(
                  f"nettest performance failed: exit={status}, gaps={sorted(gap_names)}, "
                  f"unexpected={unexpected}"
              )
          if status != 0:
              print("accepted nettest content-free exit: expected content-backed gaps only")
          PY
          python3 tools/perf/compare-baseline.py collect \
            --source nettest=artifacts/perf/nettest.json \
            --output artifacts/perf/current.json
          python3 tools/perf/compare-baseline.py compare \
            --baseline tools/perf/baseline.json \
            --current artifacts/perf/current.json \
            --output artifacts/perf/comparison.json

      - name: multiplayer content audit malformed-input checks
        run: dotnet artifacts/nettest/nettest.dll --audit-multiplayer-self-test
      - name: mixed-combat reliable backpressure checks
        run: dotnet artifacts/nettest/nettest.dll --mixed-backpressure-self-test
      - name: fresh extracted server package smoke (when content is supplied)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        env:
          GAME_DATA_DIRECTORY: ${{ secrets.GAME_DATA_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -z "${GAME_DATA_DIRECTORY:-}" ]; then
            echo "GAME_DATA_DIRECTORY is not configured; structural package checks completed."
          else
            tools/package-smoke.sh --bundle artifacts/server-linux-x64 --content-dir "$GAME_DATA_DIRECTORY"
          fi
      - name: authoritative fidelity smoke (when content is supplied)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        env:
          GAME_DATA_DIRECTORY: ${{ secrets.GAME_DATA_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -z "${GAME_DATA_DIRECTORY:-}" ]; then
            echo "GAME_DATA_DIRECTORY is not configured; content-backed fidelity smoke was not run."
          else
            dotnet test tests/Tests/Tests.csproj -c Release --no-build \
              --filter "Category=FidelitySmoke&RequiresGameContent=true"
          fi
      - name: authoritative WAN connection baseline (synthetic states, not gameplay)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: >
          python3 tools/run-network-baseline.py
          --nettest artifacts/nettest/nettest.dll
          --output artifacts/network-baseline --seconds 10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: network-baseline
          path: artifacts/network-baseline

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: project-prime-performance-baseline
          path: artifacts/perf
          if-no-files-found: ignore
