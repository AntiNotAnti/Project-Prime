# Run the fast guards for every source push and pull request, and reserve the
# publish matrix for nightly/manual confidence runs. Refuse to publish
# anything that came out of the cartridge.
#
# The guard runs twice on purpose: once over what git is tracking, and once
# over what the build produced. The first catches a map preview committed by
# accident, the second catches one that got swept into an artifact.
name: build

on:
  push:
    branches: ["**"]
    paths:
      - '.github/workflows/**'
      - '.editorconfig'
      - 'Directory.*'
      - 'Game.sln'
      - 'global.json'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'maps/**'
      - 'build/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.editorconfig'
      - 'Directory.*'
      - 'Game.sln'
      - 'global.json'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'maps/**'
      - 'build/**'
  schedule:
    # The publish matrix is deliberately a nightly/manual confidence tier;
    # ordinary pushes and pull requests stay on the fast and integration tiers.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-prime-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: nothing from the game is tracked
        run: tools/check-no-game-assets.sh

      - name: every custom map has the level it converts
        run: tools/check-maps-shipped.sh

      - name: project boundaries and server dependency contract
        run: python3 tools/check-project-boundaries.py

      - name: generated renderer shaders are fresh
        run: python3 tools/check-render-shaders.py

      - name: no retired campaign runtime in source
        run: python3 tools/check-multiplayer-only.py

      - name: package and source boundary guardrails
        run: python3 tools/check-build-guardrails.py --root .

      - name: content-free compile of gameplay and client layers
        run: |
          set -euo pipefail
          dotnet build src/Game/Game.csproj -c Release
          dotnet build src/Client.Core/Client.Core.csproj -c Release
          dotnet build src/Renderer/Renderer.csproj -c Release
          dotnet build src/Client/Client.csproj -c Release

      - name: content-free server, replay and map tests
        run: |
          dotnet test tests/Server.Shared.Tests/Server.Shared.Tests.csproj -c Release \
            --filter "RequiresGameContent!=true"
          dotnet test tests/MapPlatform.Tests/MapPlatform.Tests.csproj -c Release \
            --filter "RequiresGameContent!=true"
          dotnet test tests/Replay.Tests/Replay.Tests.csproj -c Release \
            --filter "RequiresGameContent!=true"
          dotnet test tests/Server.Worker.Tests/Server.Worker.Tests.csproj -c Release \
            --filter "RequiresGameContent!=true"

      # P2.1 owns these focused projects. Keep the aggregate content-heavy test
      # project out of the fast tier while the extracted suites cover the client
      # lifecycle and renderer contracts directly.
      - name: focused client and renderer tests
        run: |
          dotnet test tests/Client.Tests/Client.Tests.csproj -c Release \
            --filter "RequiresGameContent!=true"
          dotnet test tests/Renderer.Tests/Renderer.Tests.csproj -c Release \
            --filter "RequiresGameContent!=true"

  map-cook:
    name: cook maps once
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: cook current map artifacts
        run: |
          set -euo pipefail
          tools/cook-maps.sh --source maps --output artifacts/maps/current \
            --configuration Release --compiler-version "$GITHUB_SHA" \
            --schema-version 1 --package-version "$GITHUB_SHA"
          test "$(find artifacts/maps/current -maxdepth 1 -type f -name '*.fpmap' | wc -l)" -gt 0
          while IFS= read -r bundle; do unzip -t "$bundle" >/dev/null; done \
            < <(find artifacts/maps/current -maxdepth 1 -type f -name '*.fpmap' | sort)
      - uses: actions/upload-artifact@v7
        with:
          name: project-prime-map-artifacts-${{ github.sha }}
          path: artifacts/maps/current
          if-no-files-found: error

  integration:
    name: integration checks
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: focused shared and map-platform tests
        run: |
          dotnet test tests/Server.Shared.Tests/Server.Shared.Tests.csproj -c Release \
            --filter "RequiresGameContent!=true"
          dotnet test tests/MapPlatform.Tests/MapPlatform.Tests.csproj -c Release \
            --filter "RequiresGameContent!=true"

  heavy:
    name: ${{ matrix.id }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    needs: [fast, map-cook, integration]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win-x64
            rid: win-x64
            project: src/Client/Client.csproj
            summary: the game and the launcher, for Windows
            extra: ""
          - id: linux-x64
            rid: linux-x64
            project: src/Client/Client.csproj
            summary: the game and the launcher, for Linux
            extra: ""
          # macOS, both processors. Cross-compiled here like the rest: the
          # launcher is Avalonia on every platform now, so there is nothing in
          # a mac build that has to be produced on a mac. Nobody has started
          # one -- see the known gaps in CLAUDE.md.
          - id: osx-x64
            rid: osx-x64
            project: src/Client/Client.csproj
            summary: the game and the launcher, for an Intel Mac
            extra: ""
          - id: osx-arm64
            rid: osx-arm64
            project: src/Client/Client.csproj
            summary: the game and the launcher, for an Apple Silicon Mac
            extra: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v7
        with:
          name: project-prime-map-artifacts-${{ github.sha }}
          path: artifacts/maps/current

      # Every target is net10.0 and every launcher is Avalonia, so all six of
      # these come off one Ubuntu runner.
      - name: publish ${{ matrix.summary }}
        run: >
          dotnet publish ${{ matrix.project }}
          -c Release -r ${{ matrix.rid }} ${{ matrix.extra }}
          --self-contained true -p:PublishSingleFile=true -p:SkipCustomMapBundleCook=true
          -p:PrimeMapArtifactRoot="$GITHUB_WORKSPACE/artifacts/maps/current"
          -p:PrimeMapCopyToPublish=true
          -o publish/${{ matrix.id }}

      - name: publish the Project Prime Editor
        run: >
          dotnet publish src/Editor/Editor.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:SkipCustomMapBundleCook=true
          -p:PrimeMapArtifactRoot="$GITHUB_WORKSPACE/artifacts/maps/current"
          -p:PrimeMapCopyToPublish=true
          -o publish/${{ matrix.id }}/editor

      - name: verify SDL GPU package payload
        run: |
          python3 tools/check-renderer-package.py --rid ${{ matrix.rid }} publish/${{ matrix.id }}
          python3 tools/check-renderer-package.py --rid ${{ matrix.rid }} \
            --executable ${{ matrix.rid == 'win-x64' && 'ProjectPrime.Editor.exe' || 'ProjectPrime.Editor' }} \
            publish/${{ matrix.id }}/editor

      - name: nothing from the game is in the output
        run: tools/check-no-game-assets.sh publish/${{ matrix.id }}

      # A release has to arrive with its maps ready. The room binaries are
      # still built on the player's machine, because they land where that
      # machine's extracted files are, but everything needed to build them
      # travels -- and a map file that reached the package without its level
      # would register a room the game then declines to build.
      - name: the custom maps reached the package
        run: tools/check-maps-shipped.sh publish/${{ matrix.id }}

      # Double-clicking the game must not put a terminal behind it. That is one
      # field in the PE header, it comes out of a csproj condition, and nothing
      # else in this workflow would notice it changing.
      - name: the game is a GUI binary
        if: matrix.id == 'win-x64'
        run: tools/check-subsystem.sh gui publish/${{ matrix.id }}/ProjectPrime.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ProjectPrime-${{ matrix.id }}
          path: publish/${{ matrix.id }}
          if-no-files-found: error

  # The Android head, and the APK a phone can install.
  #
  # Its own job rather than a row in the matrix above, because nothing about it
  # matches: a different target framework (net10.0-android36.0, not net10.0), a
  # JDK and an Android SDK the other six targets do not need, and an APK rather
  # than a folder of binaries. It is also the only job whose failure is usually
  # about *shared* code -- the head compiles the same sources with ANDROID
  # defined, so it stops building the moment they grow something desktop-only,
  # which is the whole reason it was in the tree before it could play anything.
  #
  # No asset guard on the output: an APK is a zip this script cannot see into,
  # and pointing it at a directory holding one would prove nothing. What
  # actually rules game data out is the `fast` job above -- the APK is built
  # from tracked sources and NuGet packages and nothing else.
  android:
    name: android
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    needs: [fast, map-cook, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v7
        with:
          name: project-prime-map-artifacts-${{ github.sha }}
          path: artifacts/maps/current

      # The Android workload brings the .NET side of the toolchain. It does not
      # bring a JDK, and the Android SDK's build tools are Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: install the android workload
        run: dotnet workload install android

      # net10.0-android36.0 wants platform 36 and its build tools, which a
      # runner image does not necessarily carry. This target asks for exactly
      # what the project declares and accepts the licences, instead of naming
      # sdkmanager packages here that would then have to be kept in step with
      # the TargetFramework.
      - name: install what the Android SDK is missing
        run: >
          dotnet build src/Android/Android.csproj
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      # The one a player would install. Release runs the IL trimmer over this
      # app, which matters here more than usual: the touch controls reach
      # OpenTK's KeyboardState and MouseState by reflection, so
      # Properties/TrimmerRoots.xml is what keeps them from being linked away
      # and turning into a first-frame crash that Debug would never show.
      - name: publish the APK
        run: >
          dotnet publish src/Android/Android.csproj
          -c Release -p:AndroidPackageFormat=apk
          -p:SkipCustomMapBundleCook=true
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:PrimeMapArtifactRoot="$GITHUB_WORKSPACE/artifacts/maps/current"
          -p:PrimeMapCopyToPublish=true
          -o publish/android

      # One APK, the one people install. An untrimmed Debug build was
      # collected beside it, as a way of telling a crash on a device apart
      # from the trimmer having removed something -- which is a thing to build
      # when that question is actually being asked, not to hand out with every
      # push: it is much bigger, much slower, and two APKs in one folder is an
      # invitation to install the wrong one. Building one by hand needs
      # `-p:EmbedAssembliesIntoApk=true`, or it holds no managed code at all
      # (see .claude/android/ANDROID-PORT.md).
      - name: collect the APK
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp publish/android/*-Signed.apk artifact/ProjectPrime-release.apk
          cat > artifact/INSTALL.txt <<'NOTE'
          Project Prime for Android.

            adb install -r ProjectPrime-release.apk

          It is signed with the SDK's debug key, which is enough to install and
          not enough for a store.

          The game's own files are yours and are not in here. Extract them on a
          desktop, then copy paths.txt and the extracted folders into

            Android/data/com.antinotanti.projectprime/files

          which shows up over USB with no storage permission asked for. The
          front screen says so while they are missing, and has a
          "Check for game files" entry for when they arrive.

          The front screen has been run, on an emulator. A match has not: that
          needs the game files above, which are nobody's to ship. If it
          misbehaves, .claude/android/ANDROID-PORT.md lists what to look at, in
          order, and `adb logcat` is where the renderer says so.
          NOTE
          ls -la artifact

      - uses: actions/upload-artifact@v7
        with:
          name: ProjectPrime-android
          path: artifact
          if-no-files-found: error

  # Additive package-contract validation for the exact protected artifact path.
  # Ordinary matrix jobs above remain unobfuscated for useful diagnostics.
  protected-linux:
    name: protected-linux-x64
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    needs: [fast, map-cook, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v7
        with:
          name: project-prime-map-artifacts-${{ github.sha }}
          path: artifacts/maps/current
      - name: restore pinned protection tool
        run: dotnet tool restore
      - name: publish protected Linux client
        run: >
          dotnet publish src/Client/Client.csproj -c Release -r linux-x64
          --self-contained true -p:PublishSingleFile=true
          -p:PrimeProtectClient=true -p:SkipCustomMapBundleCook=true
          -p:PrimeMapArtifactRoot="$GITHUB_WORKSPACE/artifacts/maps/current"
          -p:PrimeMapCopyToPublish=true
          -o publish/protected-linux-x64
      - name: verify protected public package
        run: |
          set -euo pipefail
          python3 tools/protection/check-obfuscation.py public publish/protected-linux-x64
          python3 tools/check-renderer-package.py --rid linux-x64 publish/protected-linux-x64
          tools/check-maps-shipped.sh publish/protected-linux-x64
          tools/check-no-game-assets.sh publish/protected-linux-x64
      - name: launch protected Linux client
        run: python3 tools/protection/linux-client-smoke.py --package publish/protected-linux-x64

  protected-android:
    name: protected-android
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    needs: [fast, map-cook, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v7
        with:
          name: project-prime-map-artifacts-${{ github.sha }}
          path: artifacts/maps/current
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: install Android workload
        run: dotnet workload install android
      - name: restore pinned protection tool
        run: dotnet tool restore
      - name: install Android SDK dependencies
        run: >
          dotnet build src/Android/Android.csproj
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True
      - name: publish protected APK
        run: >
          dotnet publish src/Android/Android.csproj -c Release
          -p:AndroidPackageFormat=apk -p:PrimeProtectClient=true -p:SkipCustomMapBundleCook=true
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:PrimeMapArtifactRoot="$GITHUB_WORKSPACE/artifacts/maps/current"
          -p:PrimeMapCopyToPublish=true
          -o publish/protected-android
      - name: verify protected APK container
        run: |
          set -euo pipefail
          mapfile -t apks < <(find publish/protected-android -maxdepth 1 -type f -name '*-Signed.apk' -print)
          test "${#apks[@]}" -eq 1
          apk=${apks[0]}
          unzip -t "$apk" >/dev/null
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$signer"
          "$signer" verify "$apk"
          python3 tools/protection/check-obfuscation.py public "$apk" publish/protected-android
          mapfile -t protection_outputs < <(find src/Android/obj/Release -type d -path '*/prime-protection/output' -print)
          test "${#protection_outputs[@]}" -eq 1
          python3 tools/protection/check-obfuscation.py verify-android-apk \
            --apk "$apk" --output-root "${protection_outputs[0]}"
          extracted="$RUNNER_TEMP/protected-apk"
          mkdir -p "$extracted"
          unzip -q "$apk" -d "$extracted"
          tools/check-no-game-assets.sh "$extracted"

      - name: enable KVM for protected Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: smoke protected APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mapfile -t apks < <(find publish/protected-android -maxdepth 1 -type f -name '*-Signed.apk' -print)
            test "${#apks[@]}" -eq 1
            python3 tools/protection/android-smoke.py --adb "$ANDROID_HOME/platform-tools/adb" --apk "${apks[0]}" --artifacts "$RUNNER_TEMP/protected-android-smoke"

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ProjectPrime-protected-android-smoke
          path: ${{ runner.temp }}/protected-android-smoke
          if-no-files-found: warn

  # The Backend, Node, and Worker are one deployable server bundle. The package
  # script keeps Backend under backend/ and Worker under worker/, and applies the
  # public ProjectPrimeServer apphost name only at the package boundary.
  server:
    name: server-${{ matrix.rid }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    needs: [fast, map-cook, integration]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v7
        with:
          name: project-prime-map-artifacts-${{ github.sha }}
          path: artifacts/maps/current

      - name: package Backend, Node and Worker
        run: tools/package-server.sh --rid "${{ matrix.rid }}" --skip-map-cook \
          --map-artifacts "$GITHUB_WORKSPACE/artifacts/maps/current" \
          --output "publish/server-${{ matrix.rid }}"

      - name: server package structural checks
        run: |
          set -euo pipefail
          bundle="publish/server-${{ matrix.rid }}"
          test -f "$bundle/backend/ProjectPrime.Backend${{ matrix.rid == 'win-x64' && '.exe' || '' }}"
          test -f "$bundle/server.example.json"
          if [ "${{ matrix.rid }}" != win-x64 ]; then test -x "$bundle/start-stack-dev.sh"; fi
          test -f "$bundle/worker/ProjectPrime.Server.Worker${{ matrix.rid == 'win-x64' && '.exe' || '' }}"
          if [ "${{ matrix.rid }}" = win-x64 ]; then
            test -f "$bundle/ProjectPrimeServer.exe"
          else
            test -x "$bundle/ProjectPrimeServer"
          fi
          tools/check-no-game-assets.sh "$bundle"

      # A runner can execute the Linux package when an operator supplies a
      # mounted AMHE1 directory. Cross-RID Windows/ARM64 builds remain
      # structural checks; no credential or game content is stored in CI.
      - name: fresh extracted Linux package smoke (when content is supplied)
        if: matrix.rid == 'linux-x64'
        env:
          GAME_DATA_DIRECTORY: ${{ secrets.GAME_DATA_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -z "${GAME_DATA_DIRECTORY:-}" ]; then
            echo "GAME_DATA_DIRECTORY is not configured; package smoke is available but skipped."
          else
            tools/package-smoke.sh --bundle "publish/server-${{ matrix.rid }}" --content-dir "$GAME_DATA_DIRECTORY"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ProjectPrime-server-${{ matrix.rid }}
          path: publish/server-${{ matrix.rid }}
          if-no-files-found: error
