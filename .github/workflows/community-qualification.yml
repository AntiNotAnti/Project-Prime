name: Community qualification

on:
  pull_request:
    paths:
      - "src/MphRead/Mods/MapGen/Sharing/**"
      - "src/MphRead/Mods/MapGen/Packaging/**"
      - "src/MphRead/Mods/Network/*Map*"
      - "src/MphRead/Mods/Launcher/Gui/Workspaces/*Community*"
      - "tools/community-qualification/**"
      - "tools/map-editor-check/**"
      - ".github/workflows/community-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-qualification-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  content-free-community:
    name: Community correctness + microbench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run original vs optimized catalog benchmarks and loopback measurements
        run: dotnet run --project tools/community-qualification -c Release -- --output artifacts/community-qualification/metrics.json
      - name: Verify isolated Community request lanes and catalog quotas
        run: dotnet run --project tools/community-service-check -c Release
      - name: Verify creator and player durable transfers
        run: dotnet run --project tools/community-transfer-check -c Release
      - name: Verify immutable cross-process archive cache
        run: dotnet run --project tools/community-cache-check -c Release
      - name: Verify CDN origin fallback and visibility
        run: dotnet run --project tools/community-cdn-check -c Release
      - name: Verify Community map facade and package identity
        run: dotnet run --project tools/map-community-check -c Release
      - name: Verify multiplayer and historical archive contracts
        run: dotnet run --project tools/map-multiplayer-check -c Release
      - name: Verify creator publication and revision lifecycle
        run: dotnet run --project tools/map-editor-check -c Release -- --community-only
      - name: Measure archive copy allocations against the original algorithm
        run: dotnet run --project tools/map-install-io-benchmark -c Release -- --mib 32 --repeat 3 --output artifacts/community-qualification/archive-io.json
      - name: Preserve cross-platform qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: community-qualification-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/community-qualification/
          if-no-files-found: warn
          retention-days: 21
