      - 'src/MphRead/Mods/Network/DemoClip.cs'
      - 'src/MphRead/Mods/Network/ServerReplayRecorder.cs'
      - 'src/MphRead/Mods/Network/ReplayFormatV3.cs'
      - 'src/MphRead/Mods/Network/ReplayIdentityCompatibility.cs'
