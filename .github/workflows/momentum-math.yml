      - 'src/MphRead/Mods/Launcher/Gui/LobbyScreen.cs'
      - 'src/MphRead/Mods/Launcher/RmlUi/Core/RmlUiOfflineRuleEditor.cs'
      - 'tools/nettest/Program.cs'
      - 'src/MphRead/MphRead.csproj'
      - 'tools/nettest/nettest.csproj'
      - 'global.json'
      - '.github/workflows/momentum-math.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: momentum-math-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  math:
    name: equations and allocations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build the production solver and headless harness
        run: dotnet build tools/nettest/nettest.csproj -c Release
      - name: Equation, input validation and fixed cadence fixtures
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --momentum-math
      - name: Private Quake III draft speed building, validation and allocations
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --momentum-practice-tuning
      - name: Offline developer admission and archival schema fences without assets
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --momentum-admission
      - name: Authoritative model rules, wire and lobby ownership without assets
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --momentum-rules
      - name: Quake III authoritative rules and protocol admission
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --quake3-rules
      - name: Quake III advanced profile, rocket impulses and historical identity
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --quake3-advanced-rules
      - name: Traversal air control, ramp lift and profile identity
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --traversal-rules
      - name: Crouch dimensions, slide equations and allocation contract
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --traversal-stance-rules
      - name: Crouch wire and historical checkpoint compatibility
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --traversal-stance-network
      - name: Crouch keyboard and saved gamepad binding contract
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --crouch-input-check
      - name: Historical replay widths and Quake III identity
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --quake3-replay-compatibility
      - name: Saved and offline model defaults, validation and rule preservation
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --momentum-offline-rules
      - name: V1 contact, speed-retention and partial-input policy
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --momentum-profile
      - name: Signed axes, packet presence and movement override lifecycle
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --momentum-input-packets
      - name: Mode and profile advisory identity, exemptions and bounded storage
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --movement-validation-shadow
      - name: Opt-in combat evidence survives completed world resets
        env:
          PRIME_NET2_EVIDENCE: '${{ runner.temp }}/momentum-combat-evidence.json'
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --momentum-combat-evidence
      - name: Warmed eight-player solver call loop with zero-allocation assertion
        env:
          DOTNET_TieredCompilation: '0'
        run: dotnet run --project tools/nettest/nettest.csproj -c Release --no-build -- --momentum-benchmark "${{ runner.temp }}/momentum-benchmark.json"
      - name: Retain machine-specific benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: momentum-math-${{ matrix.os }}
          path: ${{ runner.temp }}/momentum-benchmark.json
          if-no-files-found: warn
