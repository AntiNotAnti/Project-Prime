# Package a tagged commit for people who just want to play.
#
#   git tag v0.9.0 && git push origin v0.9.0
#
# Or, from the Actions tab, with nothing typed and nothing cloned: pick a
# `bump` and this workflow creates the tag itself before building it. That is
# the whole of the auto-tagging here -- there is deliberately none on a push
# to master, because every push would then be a release.
#
# Produces one archive per target, each holding binaries and a note, and
# nothing else: the game's own files are unpacked from the player's cartridge
# dump by the launcher, on their machine, and are never part of a release.
#
# What it leaves is a *draft*. The packages are built, checked and uploaded,
# and publishing them is a person pressing the button.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # Neither is required: give a tag to rebuild one that exists, or leave it
      # empty and pick a bump to have the next one created here. Both empty is
      # the one combination that fails, and it says so.
      tag:
        description: Existing tag to build (leave empty to bump instead)
        required: false
      bump:
        description: Create the next tag from the newest one, when no tag is given
        required: false
        default: none
        type: choice
        options: [none, patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Resolved before anything is checked out, because gh api needs no local
      # repo and this is what turns "typed without its v" or "that tag was
      # never pushed" into one clear line instead of actions/checkout quietly
      # retrying a fetch for a ref that was never going to exist -- which is
      # exactly the failure a workflow_dispatch run with a typo produces.
      #
      # It is also where a tag gets *created*, for a dispatch run that asked
      # for a bump. Doing it here rather than in a workflow of its own is not
      # tidiness: a tag pushed with the default GITHUB_TOKEN does not trigger
      # another workflow (GitHub's anti-recursion rule), so a separate tag.yml
      # would need a PAT or a GitHub App to make this one run. One workflow
      # that can mint its own tag needs no second credential at all.
      - name: resolve the tag
        id: name
        env:
          GH_TOKEN: ${{ github.token }}
          # Evaluated by the expressions engine, not by bash, and kept in two
          # separate variables on purpose. GITHUB_REF_NAME is *always* set --
          # for workflow_dispatch it is whichever branch was picked to run the
          # workflow from, "master" more often than not -- so any fallback that
          # can reach it from a dispatch run silently rebuilds that branch
          # instead of failing. PUSHED_TAG is empty unless a tag push is what
          # started this, which is the only event where ref_name is a tag.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          BUMP: ${{ github.event.inputs.bump }}
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$PUSHED_TAG}"

          if [ -n "$TAG" ]; then
            # This project's tags are always v-prefixed (push: tags: ["v*"]);
            # a bare version number typed into workflow_dispatch is that tag,
            # not a different one worth failing over.
            if [[ "$TAG" != v* ]]; then
              TAG="v$TAG"
            fi
            if ! gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::No tag '$TAG' exists in $REPO. Push one first:"
              echo "::error::  git tag $TAG && git push origin $TAG"
              exit 1
            fi
            echo "Building the existing tag $TAG."
          elif [ "${BUMP:-none}" != none ]; then
            # The newest release tag, sorted as versions rather than as text --
            # the refs API returns them in ref order, where v0.10.0 sorts
            # before v0.9.0. Anything not vX.Y.Z is not a release of this
            # project and does not get a vote.
            LATEST=$(gh api "repos/$REPO/git/refs/tags" --paginate --jq '.[].ref' 2>/dev/null \
              | sed 's#^refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1 || true)
            if [ -z "$LATEST" ]; then
              # Nothing to bump from. Releases here are numbered from v0.1.0
              # (CLAUDE.md), so that is the first tag whichever bump was asked
              # for -- a "patch" off an imagined v0.0.0 would give v0.0.1.
              TAG=v0.1.0
              echo "No release tag exists yet; starting at $TAG."
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              case "$BUMP" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                patch) PATCH=$((PATCH + 1)) ;;
              esac
              TAG="v$MAJOR.$MINOR.$PATCH"
              echo "Newest release tag is $LATEST; $BUMP bump gives $TAG."
            fi
            if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG already exists. Build it by name, or bump past it."
              exit 1
            fi
            # On the commit this run was dispatched from, which is the tip of
            # whichever branch the dropdown picked.
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
            echo "Created $TAG at ${SHA:0:7}."
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Give a tag to build, or pick a bump to create the next one."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The bare number, for -p:Version. The updater compares this against
          # the tag on GitHub, so a build that is not stamped here is one that
          # can never know it is out of date.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "### Fruity Prime $TAG" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.name.outputs.tag }}

      - name: test authoritative server update packaging
        run: python3 -m unittest discover -s tools/tests -p test_server_update_package.py

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # For the Android package. The workload brings the .NET side of that
      # toolchain and not a JDK, and the Android SDK's build tools are Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: install the android workload
        run: dotnet workload install android

      - name: nothing from the game is tracked
        run: tools/check-no-game-assets.sh

      - name: every custom map has the level it converts
        run: tools/check-maps-shipped.sh

      # Cook every custom map into the one file it ships as. The recipe, the
      # level it converts and the textures baked from it go into a .fpmap,
      # with the level trimmed to the lumps the importer actually reads: 376 KB
      # for de_dust2 against the 2.8 MB its folder weighs. That bundle is what
      # the packages carry, and it is what somebody can be handed on its own --
      # the .pk3 it was cooked from is a source and is kept out of the output
      # by CopyToPublishDirectory. It is not committed, so it is cooked here.
      - name: cook the map bundles
        run: dotnet run --project src/MphRead/MphRead.csproj -c Release -- -mapdir maps -mapbundle

      - name: publish every target
        env:
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          set -euo pipefail
          stamp="-p:Version=$VERSION -p:InformationalVersion=$VERSION"
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            dotnet publish src/MphRead/MphRead.csproj -c Release -r "$rid" $stamp \
              --self-contained true -p:PublishSingleFile=true -o "publish/$rid"
          done
          # The three server packages: Windows, plain x64 Linux (a VPS, a
          # spare desktop -- anything that is not the Pi) and ARM64 (the Pi).
          # Same project each time, launcher left out, no UI toolkit: none of
          # these machines has anybody sitting at it.
          #
          # Only the Windows one gets a name of its own (FruityPrimeServer,
          # from a console-subsystem header) so that it can sit in a folder
          # beside the game's exe. Off Windows the subsystem split does not
          # exist and every server package holds exactly one binary, so both
          # keep the plain name FruityPrime.
          dotnet publish src/MphRead/MphRead.csproj -c Release -r win-x64 \
            -p:MphReadServer=true $stamp --self-contained true \
            -p:PublishSingleFile=true -o publish/win-x64-server
          dotnet publish src/MphRead/MphRead.csproj -c Release -r linux-x64 \
            -p:MphReadServer=true $stamp --self-contained true \
            -p:PublishSingleFile=true -o publish/linux-x64-server
          dotnet publish src/MphRead/MphRead.csproj -c Release -r linux-arm64 \
            -p:MphReadServer=true $stamp --self-contained true \
            -p:PublishSingleFile=true -o publish/linux-arm64

      # The phone, from the same tag and stamped with the same version -- the
      # updater compares that against the tag on GitHub, and an APK that is not
      # stamped is one that can never know it is out of date.
      #
      # InstallAndroidDependencies rather than named sdkmanager packages: it
      # asks for whatever the project's TargetFramework declares, so bumping
      # net9.0-android35.0 does not silently leave this behind.
      # The signing key, when there is one.
      #
      # This is what makes the in-app updater possible and it is not a
      # nicety: Android refuses an update whose signing certificate differs
      # from the installed app's, and the SDK's debug key is generated on the
      # machine doing the build -- so every release from a fresh runner used
      # to carry a *different* certificate and none of them could replace
      # another. See .claude/build-deploy/BUILD-WORKFLOW.md.
      #
      # Absent secrets fall back to the debug key rather than failing the
      # release: a fork with no keystore still gets an installable APK, it
      # simply cannot be updated in place.
      - name: unlock the android keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE:-}" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no ANDROID_KEYSTORE secret; the APK gets a throwaway debug key and cannot update an existing install"
            exit 0
          fi
          # Outside the workspace, so no later step can archive it by accident.
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/android.jks"
          echo "have=true" >> "$GITHUB_OUTPUT"

      - name: publish the APK
        env:
          VERSION: ${{ steps.name.outputs.version }}
          HAVE_KEYSTORE: ${{ steps.keystore.outputs.have }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          proj=src/MphRead.Android/MphRead.Android.csproj
          sdk=( -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" )
          signing=()
          if [ "$HAVE_KEYSTORE" = "true" ]; then
            # env: rather than the passwords themselves. .NET for Android
            # reads that prefix as "the variable named this", which keeps
            # both out of the process table and out of the MSBuild log.
            signing=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/android.jks"
              -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
              -p:AndroidSigningKeyAlias="$KEY_ALIAS"
              -p:AndroidSigningKeyPass=env:KEY_PASSWORD
            )
          fi
          dotnet build "$proj" -t:InstallAndroidDependencies "${sdk[@]}" \
            -p:AcceptAndroidSDKLicenses=True
          dotnet publish "$proj" -c Release -p:AndroidPackageFormat=apk "${sdk[@]}" \
            "${signing[@]}" \
            -p:Version="$VERSION" -p:InformationalVersion="$VERSION" \
            -p:ApplicationDisplayVersion="$VERSION" \
            -o publish/android

      # What the updater will compare against on every phone. Printed, not
      # checked: nothing here knows what the previous release was signed with,
      # and a fingerprint in the log is what turns "App not installed" into a
      # two-minute diff against the last release's run.
      - name: report the APK's signer
        run: |
          set -euo pipefail
          apk=$(ls publish/android/*-Signed.apk | head -1)
          # apksigner rather than keytool: a package signed only with the v2
          # or v3 scheme has no jar signature for keytool to print, and .NET
          # for Android decides which schemes to use on its own.
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -n "$signer" ]; then
            "$signer" verify --print-certs "$apk" | grep -Ei "SHA-256 digest|Signer" || true
          else
            "$JAVA_HOME/bin/keytool" -printcert -jarfile "$apk" \
              | grep -E "SHA256:|Owner:" || true
          fi

      - name: nothing from the game is in the output
        run: >
          tools/check-no-game-assets.sh publish/win-x64 publish/linux-x64
          publish/osx-x64 publish/osx-arm64
          publish/linux-arm64 publish/win-x64-server publish/linux-x64-server

      # What a downloaded release is judged on: the maps are there and ready.
      - name: the custom maps reached every package
        run: >
          for d in publish/win-x64 publish/linux-x64 publish/osx-x64
          publish/osx-arm64 publish/linux-arm64; do
          tools/check-maps-shipped.sh "$d" || exit 1; done

      # A GUI game and a console server, which is what makes one
      # double-clickable and the other scriptable. Checked before a tag exists,
      # because a release is where getting it wrong reaches players.
      - name: each Windows binary is what it claims to be
        run: |
          set -euo pipefail
          tools/check-subsystem.sh gui publish/win-x64/FruityPrime.exe
          tools/check-subsystem.sh console publish/win-x64-server/FruityPrimeServer.exe

      # Without cartridge assets, validate the required-data error and a
      # directory-only query. This is a packaging smoke check, not gameplay
      # evidence. The Windows server gets the same check in build.yml.
      - name: the server content contract and directory run
        run: |
          set -euo pipefail
          tools/check-dedicated-server.sh publish/linux-x64
          tools/check-dedicated-server.sh publish/linux-x64-server

      - name: package
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp LICENSE publish/win-x64/ 2>/dev/null || true
          cat > publish/win-x64/README.txt <<'NOTE'
          Fruity Prime -- Metroid Prime Hunters, on a PC, with multiplayer.

          Double-click FruityPrime.exe. The first thing it asks for is your own
          Metroid Prime Hunters cartridge dump (.nds); it unpacks what it needs
          next to this program and leaves the file alone. No game data is
          included in this download, and none is downloaded.

          Play online joins a server. Play offline is a match against bots.
          Host a game has a public machine run the match and puts you in it,
          so there is nothing to open on your router.
          F11 or Alt+Enter switches to fullscreen, Escape leaves it.

          To run a server for other people without playing on it yourself,
          download the server package instead -- it is a separate, smaller
          download. Authoritative matches require your extracted game files or
          a baked server content package. See SERVER.md in the source.
          NOTE
          ( cd publish/win-x64 && zip -qr "../../dist/FruityPrime-$TAG-win-x64.zip" . )

          cp LICENSE publish/linux-x64/ 2>/dev/null || true
          cat > publish/linux-x64/README.txt <<'NOTE'
          Fruity Prime -- Metroid Prime Hunters, on a PC, with multiplayer.

          Set up with your own Metroid Prime Hunters cartridge dump (.nds).
          It is unpacked next to this program and the file is left alone. No
          game data is included in this download, and none is downloaded.

            ./FruityPrime -launcher

          opens the front screen: play online, play offline against bots, host
          a game, settings, and the game-files setup.

          Over SSH, or on a machine with no desktop, the same command gives you
          the same five entries as text instead. -launcher -text asks for that
          anywhere.

          Everything it does also has a command of its own:

            ./FruityPrime <path to rom.nds>     set up the game files
            ./FruityPrime -servers              list the servers that are up
            ./FruityPrime -connect HOST         join one
            ./FruityPrime -hostgame "ROOM"      have a server run a match for you
            ./FruityPrime -menu                 volumes, controls, match rules

          This build can also run an authoritative dedicated server:

            ./FruityPrime -server -data /path/to/files/AMHE1 -dataversion AMHE1

          Match simulation requires your extracted game files or a baked server
          content package. The server packages omit the launcher and provide the
          same simulation, for plain x64 Linux and Raspberry Pi ARM64.

          F11 or Alt+Enter switches to fullscreen, Escape opens the pause menu.
          NOTE
          ( cd publish/linux-x64 && tar czf "../../dist/FruityPrime-$TAG-linux-x64.tar.gz" . )

          # The two macOS packages. Same note, and the same launcher: the
          # front screen is Avalonia on every desktop now, so nothing about a
          # mac build differs except its processor. Neither has been started
          # by anybody -- see the known gaps in CLAUDE.md.
          for rid in osx-x64 osx-arm64; do
            cp LICENSE "publish/$rid/" 2>/dev/null || true
            cat > "publish/$rid/README.txt" <<'NOTE'
          Fruity Prime -- Metroid Prime Hunters, on a Mac, with multiplayer.

          Set up with your own Metroid Prime Hunters cartridge dump (.nds).
          It is unpacked next to this program and the file is left alone. No
          game data is included in this download, and none is downloaded.

            ./FruityPrime

          opens the front screen: adventure, play online, play offline against
          bots, host a game, settings, and the game-files setup.

          macOS keeps downloaded programs quarantined. If it refuses to open
          this one, clear the flag on the folder:

            xattr -dr com.apple.quarantine .

          F11 or Alt+Enter switches to fullscreen, Escape opens the pause menu.
          NOTE
            chmod +x "publish/$rid/FruityPrime" || true
            ( cd "publish/$rid" && tar czf "../../dist/FruityPrime-$TAG-$rid.tar.gz" . )
          done
          cat > publish/linux-arm64/SERVER.txt <<'NOTE'
          Fruity Prime dedicated server.

            ./FruityPrime -server -data /srv/fruity-content -dataversion AMHE1 -port 27888 -players 8 -servername "My server"

          Supply your extracted game directory or a baked server content package.
          The .nds file is not a directory. No cartridge data is included here.
          Use -rotation FILE for an existing map cycle; none is created automatically.

          The server is unlisted by default. Add -master net.livetek.fr:27889
          to publish it in that directory, or specify your own HOST:PORT.
          -nomaster disables listing even when -master is present.

          A directory-only instance needs no game files:

            ./FruityPrime -masterserver -port 27889 -hostports none
          NOTE
          ( cd publish/linux-arm64 && tar czf "../../dist/FruityPrime-$TAG-server-linux-arm64.tar.gz" . )

          cp LICENSE publish/linux-x64-server/ 2>/dev/null || true
          cat > publish/linux-x64-server/SERVER.txt <<'NOTE'
          Fruity Prime dedicated server, for a plain x64 Linux machine -- a
          VPS, a spare desktop, anything that is not a Raspberry Pi (see the
          ARM64 package for that) and that nobody is playing on.

            ./FruityPrime -server -data /srv/fruity-content -dataversion AMHE1 -port 27888 -players 8 -servername "My server"

          Supply your extracted game directory or a baked server content package.
          The .nds file is not a directory. No cartridge data is included here.
          Use -rotation FILE for an existing map cycle; none is created automatically.

          The server is unlisted by default. Add -master net.livetek.fr:27889
          to publish it in that directory, or specify your own HOST:PORT.
          -nomaster disables listing even when -master is present.

          A directory-only instance needs no game files:

            ./FruityPrime -masterserver -port 27889 -hostports none

          See SERVER.md in the source for content baking, hosted-game directories
          and service setup. deploy-server.sh uploads only the ARM64 binary and
          requires MPH_SERVER_DATA to point to content already on that machine.
          NOTE
          ( cd publish/linux-x64-server && tar czf "../../dist/FruityPrime-$TAG-server-linux-x64.tar.gz" . )

          cp LICENSE publish/win-x64-server/ 2>/dev/null || true
          cat > publish/win-x64-server/SERVER.txt <<'NOTE'
          Fruity Prime dedicated server, for Windows.

          From a Command Prompt or PowerShell, in this folder:

            FruityPrimeServer.exe -server -data "C:\FruityPrime\content" -dataversion AMHE1 -port 27888 -players 8 -servername "My server"

          Supply your extracted game directory or a baked server content package.
          The .nds file is not a directory. No cartridge data is included here.
          Use -rotation FILE for an existing map cycle; none is created automatically.

          This is a console program, unlike FruityPrime.exe: the window stays until
          the server stops, Ctrl+C shuts it down cleanly, and its exit code is
          reported, so it can be run under a service supervisor (NSSM, or
          sc.exe with a wrapper) the way the Linux build runs under systemd.
          Double-clicking it displays usage; starting a match requires -data.

          Windows will ask once whether to allow it through the firewall.
          Nobody outside this machine can reach the server until that is
          allowed for UDP on the port above, and until the router forwards it.

          The server is unlisted by default. Add -master net.livetek.fr:27889
          to publish it in that directory, or specify your own HOST:PORT.
          -nomaster disables listing even when -master is present.

          A directory-only instance needs no game files:

            FruityPrimeServer.exe -masterserver -port 27889 -hostports none

          To see what is up right now:

            FruityPrimeServer.exe -servers
          NOTE
          ( cd publish/win-x64-server && zip -qr "../../dist/FruityPrime-$TAG-server-win-x64.zip" . )

          # The APK goes out on its own rather than in an archive: what a phone
          # wants is a file it can be handed. Signed with the release keystore
          # when the secrets are set, and with a throwaway debug key when they
          # are not -- the second installs, and can never be updated in place.
          cp publish/android/*-Signed.apk "dist/FruityPrime-$TAG-android.apk"
          ls -la dist

      # Update assets require an explicitly configured authoritative fork.
      # Without this repository variable, normal release packages are unchanged.
      - name: generate-authoritative-server-update-assets
        if: vars.AUTHORITATIVE_RELEASE_REPOSITORY == github.repository && github.repository != 'liveteklol/Fruity-Prime'
        env:
          TAG: ${{ steps.name.outputs.tag }}
          REPOSITORY: ${{ vars.AUTHORITATIVE_RELEASE_REPOSITORY }}
        run: |
          set -euo pipefail
          python3 tools/server-update-package.py build --publish publish/win-x64-server \
            --rid win-x64 --tag "$TAG" --repository "$REPOSITORY" --output dist
          python3 tools/server-update-package.py build --publish publish/linux-x64-server \
            --rid linux-x64 --tag "$TAG" --repository "$REPOSITORY" --output dist
          python3 tools/server-update-package.py build --publish publish/linux-arm64 \
            --rid linux-arm64 --tag "$TAG" --repository "$REPOSITORY" --output dist
          for rid in win-x64 linux-x64 linux-arm64; do
            python3 tools/server-update-package.py verify \
              --manifest "dist/authoritative-update-$rid-server.json" \
              --directory dist --tag "$TAG" --rid "$rid"
          done

      # A draft: everything is built and uploaded, and a person presses the
      # button. This is the one workflow whose output people download, and a
      # tag can be pushed by accident; a draft is the step where somebody reads
      # the notes and looks at the file list before any of it is public.
      #
      # Not flagged a prerelease, though the notes say beta. GitHub's
      # releases/latest -- which is exactly what the in-app update check asks
      # for (Mods/Update/UpdateCheck.cs) -- skips prereleases, so flagging one
      # would quietly turn the updater off for every player.
      #
      # Rerunning the same tag updates the draft rather than failing: the
      # create/upload arms are chosen by whether the release is already there,
      # instead of running create and treating any error at all as "it exists".
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTE'
          **Beta.** It plays, it is not finished -- expect rough edges, and please say what you
          hit in [Issues](https://github.com/liveteklol/Fruity-Prime/issues).

          You bring your own Metroid Prime Hunters cartridge dump. No game data is included here
          and none is downloaded.

          - **Windows** -- the `win-x64` zip, run `FruityPrime.exe`
          - **Linux / macOS** -- the `.tar.gz`, run `./FruityPrime -launcher`
          - **Android** -- the `.apk`
          - **Running a server** -- the `server-` packages plus your own extracted or baked game content; directory-only mode needs no game files

          Setup and everything else is in the [README](https://github.com/liveteklol/Fruity-Prime#readme).
          NOTE

          # What actually changed, from GitHub's own generator: every commit
          # and merged PR since the previous release tag, which it works out
          # itself from the tag name. Without this the notes are the same
          # words every time and say nothing about the build being downloaded.
          #
          # Appended rather than substituted, and never fatal: a rate limit or
          # a tag with no predecessor leaves the standing block, which is the
          # part that has to be there. The changelog is the part that is nice
          # to have.
          CHANGES=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body 2>/dev/null || true)
          if [ -n "$CHANGES" ]; then
            printf '\n---\n\n%s\n' "$CHANGES" >> notes.md
          else
            echo "::warning::No changelog could be generated for $TAG; the notes are the standing block alone."
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Fruity Prime $TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --draft --verify-tag \
              --title "Fruity Prime $TAG" --notes-file notes.md
          fi
