# Package a tagged commit for people who just want to play.
#
#   git tag v0.9.0 && git push origin v0.9.0
#
# Or, from the Actions tab, with nothing typed and nothing cloned: pick a
# `bump` and this workflow creates the tag itself before building it. That is
# the whole of the auto-tagging here -- there is deliberately none on a push
# to master, because every push would then be a release.
#
# Produces one archive per target, each holding binaries and a note, and
# nothing else: the game's own files are unpacked from the player's cartridge
# dump by the launcher, on their machine, and are never part of a release.
#
# Finished packages are published as GitHub Releases in this public repository,
# so the project page, download links and in-app updater all use one canonical
# release channel. A manual run may leave a draft; tag pushes publish after all
# build and verification jobs succeed.
name: release

on:
  push:
    tags: ["v*"]
    # The review branch is the only permitted source of the one-time v0.1.47
    # recovery release. Its first merge triggers the full release test matrix;
    # the original unrelated and unpublished tag is retargeted only then.
    branches: ["release/v0.1.47"]
  workflow_dispatch:
    inputs:
      # Neither is required: give a tag to rebuild one that exists, or leave it
      # empty and pick a bump to have the next one created here. Both empty is
      # the one combination that fails, and it says so.
      tag:
        description: Existing tag to build (leave empty to bump instead)
        required: false
      bump:
        description: Create the next tag from the newest release, when no tag is given
        required: false
        default: none
        type: choice
        options: [none, patch, minor, major]
      publish:
        description: Publish to clients after successful builds (off leaves a draft)
        required: false
        default: false
        type: boolean
      retarget_unpublished:
        description: Explicitly retarget an existing unpublished v0.1.47 tag to the selected hotfix branch
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      version: ${{ steps.name.outputs.version }}
      android_version_code: ${{ steps.name.outputs.android_version_code }}
    steps:
      # Resolved before anything is checked out, because gh api needs no local
      # repo and this is what turns "typed without its v" or "that tag was
      # never pushed" into one clear line instead of actions/checkout quietly
      # retrying a fetch for a ref that was never going to exist -- which is
      # exactly the failure a workflow_dispatch run with a typo produces.
      #
      # It is also where a tag gets *created*, for a dispatch run that asked
      # for a bump. Doing it here rather than in a workflow of its own is not
      # tidiness: a tag pushed with the default GITHUB_TOKEN does not trigger
      # another workflow (GitHub's anti-recursion rule), so a separate tag.yml
      # would need a PAT or a GitHub App to make this one run. One workflow
      # that can mint its own tag needs no second credential at all.
      - name: resolve the tag
        id: name
        env:
          GH_TOKEN: ${{ github.token }}
          # Evaluated by the expressions engine, not by bash, and kept in two
          # separate variables on purpose. GITHUB_REF_NAME is *always* set --
          # for workflow_dispatch it is whichever branch was picked to run the
          # workflow from, "master" more often than not -- so any fallback that
          # can reach it from a dispatch run silently rebuilds that branch
          # instead of failing. PUSHED_TAG is empty unless a tag push is what
          # started this, which is the only event where ref_name is a tag.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RETARGET_UNPUBLISHED: ${{ github.event.inputs.retarget_unpublished }}
          BUMP: ${{ github.event.inputs.bump }}
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
          PUSHED_HOTFIX: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/v0.1.47' && 'v0.1.47' || '' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${PUSHED_TAG:-$PUSHED_HOTFIX}}"
          if [ -n "$PUSHED_HOTFIX" ]; then
            RETARGET_UNPUBLISHED=true
          fi
          CREATE_TAG=false
          # Bound each component before doing Bash arithmetic (which can wrap).
          RELEASE_TAG='^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'

          if [ -n "$TAG" ]; then
            # This project's tags are always v-prefixed (push: tags: ["v*"]);
            # a bare version number typed into workflow_dispatch is that tag,
            # not a different one worth failing over.
            if [[ "$TAG" != v* ]]; then
              TAG="v$TAG"
            fi
            if ! gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::No tag '$TAG' exists in $REPO. Push one first:"
              echo "::error::  git tag $TAG && git push origin $TAG"
              exit 1
            fi
            if [ "${RETARGET_UNPUBLISHED:-false}" = "true" ]; then
              # v0.1.47 was tagged at an unrelated RmlUi commit but never
              # published. Only a manual run from our hotfix branch may reuse
              # it, and only while GitHub has no Release for that tag.
              if [ "$TAG" != "v0.1.47" ]; then
                echo "::error::Only the unpublished v0.1.47 hotfix tag may be retargeted."
                exit 1
              fi
              if [ "${{ github.ref_type }}" != "branch" ] || [ "${{ github.ref_name }}" != "release/v0.1.47" ]; then
                echo "::error::Only the reviewed release/v0.1.47 branch may retarget the unpublished tag."
                exit 1
              fi
              if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
                echo "::error::$TAG already has a Release. Never mutate a released tag."
                exit 1
              fi
              gh api -X PATCH "repos/$REPO/git/refs/tags/$TAG" \
                -f sha="$SHA" -F force=true >/dev/null
              echo "Retargeted previously unpublished $TAG to ${SHA:0:7}."
            elif [ "$TAG" = "v0.1.47" ]; then
              # An unreviewed manual run must never build the orphan tag from
              # an unrelated October 8 RmlUi commit.
              release_branch=$(gh api "repos/$REPO/branches/release/v0.1.47" --jq '.commit.sha')
              selected_tag=$(gh api "repos/$REPO/git/ref/tags/v0.1.47" --jq '.object.sha')
              if [ "$selected_tag" != "$release_branch" ]; then
                echo "::error::v0.1.47 still points to an unrelated commit. Merge the hotfix into release/v0.1.47 first."
                exit 1
              fi
            fi
            echo "Building the existing tag $TAG."
          elif [ "${BUMP:-none}" != none ]; then
            # Bump from actual releases, not bare tag refs. A failed release can
            # leave its workflow-created tag behind before any Release exists; counting
            # that orphan would burn a version number on every retry.
            LATEST=$(gh api "repos/$REPO/releases" --paginate --jq '.[].tag_name' 2>/dev/null \
              | grep -E "$RELEASE_TAG" \
              | sort -V | tail -1 || true)
            if [ -z "$LATEST" ]; then
              # Nothing to bump from. Releases here are numbered from v0.1.0
              # (CLAUDE.md), so that is the first tag whichever bump was asked
              # for -- a "patch" off an imagined v0.0.0 would give v0.0.1.
              TAG=v0.1.0
              echo "No release tag exists yet; starting at $TAG."
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              case "$BUMP" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                patch) PATCH=$((PATCH + 1)) ;;
              esac
              TAG="v$MAJOR.$MINOR.$PATCH"
              echo "Newest release is $LATEST; $BUMP bump gives $TAG."
            fi
            CREATE_TAG=true
          else
            echo "::error::Give a tag to build, or pick a bump to create the next one."
            exit 1
          fi

          if [[ ! "$TAG" =~ $RELEASE_TAG ]]; then
            echo "::error::Release tag '$TAG' must use vMAJOR.MINOR.PATCH, with components 0-999 and no leading zeroes."
            exit 1
          fi
          VERSION="${TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( 10#$MAJOR > 999 || 10#$MINOR > 999 || 10#$PATCH > 999 )); then
            echo "::error::Release tag '$TAG' cannot be represented by Android's versionCode."
            exit 1
          fi
          ANDROID_VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( ANDROID_VERSION_CODE < 1 )); then
            echo "::error::Release tag '$TAG' produces an invalid Android versionCode."
            exit 1
          fi

          # A failed workflow can leave the tag behind before the Release is
          # published. That tag has never been offered to clients, so a retry may safely
          # retarget it to the current dispatch SHA. Once a Release exists, the tag is
          # immutable here and a new version must be chosen instead.
          if [ "$CREATE_TAG" = true ]; then
            if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
                echo "::error::$TAG already has a GitHub Release; choose a later version."
                exit 1
              fi
              gh api -X PATCH "repos/$REPO/git/refs/tags/$TAG" \
                -f sha="$SHA" -F force=true >/dev/null
              echo "Recovered unpublished $TAG at ${SHA:0:7}."
            else
              gh api -X POST "repos/$REPO/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
              echo "Created $TAG at ${SHA:0:7}."
            fi
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # All published packages consume this one release number. The
          # updater compares it against the tag on GitHub, so a build that is
          # not stamped here can never know it is out of date.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Android also needs a monotonically increasing integer versionCode;
          # encode the same semver as MAJOR.MINOR.PATCH without losing order.
          echo "android_version_code=$ANDROID_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "### Project Prime $TAG" >> "$GITHUB_STEP_SUMMARY"

  prepare-release:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-game-${{ hashFiles('global.json', 'src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-game-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: nothing from the game is tracked
        run: tools/check-no-game-assets.sh
      - name: every custom map has the level it converts
        run: tools/check-maps-shipped.sh
      # Release can be dispatched while the normal build workflow is cancelled
      # by a newer push. Run the asset-free lobby suite here too so wire-format
      # regressions in Create Lobby cannot ship behind a green packaging smoke.
      - name: updater handoff and rollback regressions
        run: dotnet run --project tools/updatecheck -c Release
      - name: release manifest portability regression
        run: python3 -m unittest discover -s tools -p 'test_release_manifest_writer.py'
      - name: hosted lobby allocation protocol
        run: dotnet run --project tools/nettest/nettest.csproj -c Release -- --lobby
      - name: cook the map bundles
        env:
          PROJECT_PRIME_USER_DATA: ${{ github.workspace }}/.release-user-data
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_PRIME_USER_DATA"
          mkdir -p "$PROJECT_PRIME_USER_DATA/user-maps"
          dotnet run --project src/MphRead/MphRead.csproj -c Release -- -mapdir maps -mapbundle
          find "$PROJECT_PRIME_USER_DATA/user-maps" -type f -name '*.ppmap' -exec cp {} maps/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-maps
          path: maps/**/*.ppmap
          if-no-files-found: error

  release-linux:
    name: publish ${{ matrix.target }}
    needs: [resolve, prepare-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            rid: win-x64
            server: false
          - target: linux-x64
            rid: linux-x64
            server: false
          - target: win-x64-server
            rid: win-x64
            server: true
          - target: linux-x64-server
            rid: linux-x64
            server: true
          - target: linux-arm64
            rid: linux-arm64
            server: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-game-${{ hashFiles('global.json', 'src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-game-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: prepared-maps
          path: maps
      - name: publish target
        env:
          TARGET: ${{ matrix.target }}
          RID: ${{ matrix.rid }}
          SERVER: ${{ matrix.server }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          args=(--self-contained true -p:PublishSingleFile=true)
          if [ "$SERVER" = "true" ]; then
            args+=(-p:MphReadServer=true)
          fi
          dotnet publish src/MphRead/MphRead.csproj -c Release -r "$RID" \
            -p:Version="$VERSION" -p:InformationalVersion="$VERSION" \
            "${args[@]}" -o "publish/$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: build-linux-${{ matrix.target }}
          path: publish/${{ matrix.target }}
          if-no-files-found: error

  release-android:
    needs: [resolve, prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-android-${{ hashFiles('global.json', 'src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-android-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: install the android workload
        run: dotnet workload install android
      - uses: actions/download-artifact@v8
        with:
          name: prepared-maps
          path: maps
      - name: unlock the android keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE:-}" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no ANDROID_KEYSTORE secret; the APK gets a throwaway debug key and cannot update an existing install"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/android.jks"
          echo "have=true" >> "$GITHUB_OUTPUT"
      - name: publish the APK
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.resolve.outputs.android_version_code }}
          HAVE_KEYSTORE: ${{ steps.keystore.outputs.have }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          proj=src/MphRead.Android/MphRead.Android.csproj
          sdk=( -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" )
          signing=()
          if [ "$HAVE_KEYSTORE" = "true" ]; then
            signing=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/android.jks"
              -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
              -p:AndroidSigningKeyAlias="$KEY_ALIAS"
              -p:AndroidSigningKeyPass=env:KEY_PASSWORD
            )
          fi
          dotnet build "$proj" -t:InstallAndroidDependencies "${sdk[@]}" \
            -p:AcceptAndroidSDKLicenses=True
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}}"
          if [ -z "$ndk" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          fi
          if [ -z "$ndk" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
            ndk="$ANDROID_HOME/ndk/28.2.13676358"
          fi
          ANDROID_NDK_ROOT="$ndk" tools/wgpu/build-native.sh android-arm64
          ANDROID_NDK_ROOT="$ndk" tools/wgpu/build-native.sh android-x64
          ANDROID_NDK_ROOT="$ndk" tools/ktx/build-native.sh android-arm64
          ANDROID_NDK_ROOT="$ndk" tools/ktx/build-native.sh android-x64
          dotnet publish "$proj" -c Release -p:AndroidPackageFormat=apk "${sdk[@]}" \
            "${signing[@]}" \
            -p:Version="$VERSION" -p:InformationalVersion="$VERSION" \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion="$ANDROID_VERSION_CODE" \
            -o publish/android
      - name: verify Android native runtimes
        run: |
          set -euo pipefail
          apk=$(ls publish/android/*-Signed.apk | head -1)
          entries="$RUNNER_TEMP/project-prime-apk-entries.txt"
          unzip -Z1 "$apk" > "$entries"
          for native in \
            lib/arm64-v8a/libwgpu_native.so \
            lib/x86_64/libwgpu_native.so \
            lib/arm64-v8a/libktx.so \
            lib/x86_64/libktx.so; do
            grep -Fxq "$native" "$entries" || {
              echo "::error::release APK is missing $native"
              exit 1
            }
          done
      - name: report the APK's signer
        run: |
          set -euo pipefail
          apk=$(ls publish/android/*-Signed.apk | head -1)
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -n "$signer" ]; then
            "$signer" verify --print-certs "$apk" | grep -Ei "SHA-256 digest|Signer" || true
          else
            "$JAVA_HOME/bin/keytool" -printcert -jarfile "$apk" | grep -E "SHA256:|Owner:" || true
          fi
      - name: name the release APK
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p dist
          cp publish/android/*-Signed.apk "dist/ProjectPrime-$TAG-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  package-release:
    needs: [resolve, release-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: build-linux-*
          path: builds
      - name: assemble target folders
        run: |
          set -euo pipefail
          for target in win-x64 linux-x64 linux-arm64 win-x64-server linux-x64-server; do
            mkdir -p "publish/$target"
            cp -a "builds/build-linux-$target/." "publish/$target/"
          done

          # Artifact upload/download is a content transport, not a reliable
          # Unix-mode transport. Restore executable bits after assembly so the
          # x64 smoke tests run the actual apphosts and the ARM64 tarball is
          # usable immediately after extraction on the target machine.
          chmod +x publish/linux-x64/ProjectPrime
          chmod +x publish/linux-x64-server/ProjectPrime
          chmod +x publish/linux-arm64/ProjectPrime
      - name: nothing from the game is in the output
        run: >
          tools/check-no-game-assets.sh publish/win-x64 publish/linux-x64
          publish/linux-arm64 publish/win-x64-server publish/linux-x64-server

      # What a downloaded release is judged on: the maps are there and ready.
      - name: the custom maps reached every package
        run: >
          for d in publish/win-x64 publish/linux-x64 publish/linux-arm64; do
          tools/check-maps-shipped.sh "$d" || exit 1; done

      # A GUI game and a console server, which is what makes one
      # double-clickable and the other scriptable. Checked before a tag exists,
      # because a release is where getting it wrong reaches players.
      - name: each Windows binary is what it claims to be
        run: |
          set -euo pipefail
          tools/check-subsystem.sh gui publish/win-x64/ProjectPrime.exe
          tools/check-subsystem.sh console publish/win-x64-server/ProjectPrimeServer.exe

      # Nothing gets tagged as a release until a server out of it has actually
      # started, registered with a directory and answered a query. This runner
      # is x64 Linux, so both x64 builds can be started here -- the game
      # build's server capability and the standalone server package, which is
      # otherwise the one server target nothing runs on a real machine before
      # it reaches a player. The Windows server gets the same check on a
      # Windows runner in build.yml; the ARM64 one cannot run on this runner
      # at all, being cross-compiled for a different processor.
      - name: the dedicated server runs
        run: |
          set -euo pipefail
          tools/check-dedicated-server.sh publish/linux-x64
          tools/check-dedicated-server.sh publish/linux-x64-server

      - name: package
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Real smoke can create the updater's coordination lock in the
          # publish folder. Never distribute/own that internal runtime file.
          for target in win-x64 linux-x64 linux-arm64 win-x64-server linux-x64-server; do
            rm -f "publish/$target/.project-prime-update.lock"
            test ! -e "publish/$target/.project-prime-update-transaction" || {
              echo "::error::$target contains a stale updater transaction"
              exit 1
            }
          done
          mkdir -p dist
          cp LICENSE publish/win-x64/ 2>/dev/null || true
          cat > publish/win-x64/README.txt <<'NOTE'
          Project Prime -- Metroid Prime Hunters, on PC, with multiplayer.

          Double-click ProjectPrime.exe. The first thing it asks for is your own
          Metroid Prime Hunters cartridge dump (.nds); it unpacks what it needs
          next to this program and leaves the file alone. No game data is
          included in this download, and none is downloaded.

          Play online joins a server. Play offline is a match against bots.
          Host a game has a public machine run the match and puts you in it,
          so there is nothing to open on your router.
          F11 or Alt+Enter switches to fullscreen, Escape leaves it.

          To run a server for other people without playing on it yourself,
          download the server package instead. The package is smaller because
          it omits the launcher/UI, but the authoritative server still needs
          your extracted game files and a valid paths.txt beside the binary.
          NOTE
          python3 tools/write-release-manifest.py publish/win-x64
          ( cd publish/win-x64 && zip -qr "../../dist/ProjectPrime-$TAG-win-x64.zip" . )

          cp LICENSE publish/linux-x64/ 2>/dev/null || true
          cat > publish/linux-x64/README.txt <<'NOTE'
          Project Prime -- Metroid Prime Hunters, on PC, with multiplayer.

          Set up with your own Metroid Prime Hunters cartridge dump (.nds).
          It is unpacked next to this program and the file is left alone. No
          game data is included in this download, and none is downloaded.

            ./ProjectPrime

          opens the front screen: play online, play offline against bots, host
          a game, settings, and the game-files setup.

          Over SSH, or on a machine with no desktop, the same command falls
          back to the text launcher. -launcher remains an explicit launcher
          flag, -launcher -text forces the text launcher, and -menu opens the
          legacy console menu.

          Everything it does also has a command of its own:

            ./ProjectPrime <path to rom.nds>     set up the game files
            ./ProjectPrime -servers              list the servers that are up
            ./ProjectPrime -connect HOST         join one
            ./ProjectPrime -hostgame "ROOM"      have a server run a match for you
            ./ProjectPrime -menu                 volumes, controls, match rules

          This build can also run a dedicated server with -server. The server
          runs the match authoritatively, so it needs your extracted game files
          and a valid paths.txt beside the binary. If that is all a machine is
          for, the server package is a smaller download with no launcher in it
          -- there is one for plain x64 Linux and one for a Raspberry Pi.

          F11 or Alt+Enter switches to fullscreen, Escape opens the pause menu.
          NOTE
          python3 tools/write-release-manifest.py publish/linux-x64
          ( cd publish/linux-x64 && tar czf "../../dist/ProjectPrime-$TAG-linux-x64.tar.gz" . )

          cat > publish/linux-arm64/SERVER.txt <<'NOTE'
          Project Prime dedicated server.

            ./ProjectPrime -server -port 27888 -players 8 -servername "My server"

          This server runs the match authoritatively and therefore requires
          your extracted Metroid Prime Hunters game files. Put a valid paths.txt
          beside the binary pointing at those files. No game data is included
          in this package. Maps come from maprotation.txt, written beside the
          binary on first run.

          The server lists itself on 51.161.113.128 so that players can find it
          in the launcher's server browser. Pass -nomaster to stay private, or
          -master HOST to use a different directory.

          To run a directory of your own:

            ./ProjectPrime -masterserver -port 27889
          NOTE
          cp SERVER.md publish/linux-arm64/SERVER.md
          python3 tools/write-release-manifest.py publish/linux-arm64
          ( cd publish/linux-arm64 && tar czf "../../dist/ProjectPrime-$TAG-server-linux-arm64.tar.gz" . )

          cp LICENSE publish/linux-x64-server/ 2>/dev/null || true
          cat > publish/linux-x64-server/SERVER.txt <<'NOTE'
          Project Prime dedicated server, for a plain x64 Linux machine -- a
          VPS, a spare desktop, anything that is not a Raspberry Pi (see the
          ARM64 package for that) and that nobody is playing on.

            ./ProjectPrime -server -port 27888 -players 8 -servername "My server"

          This server runs the match authoritatively and therefore requires
          your extracted Metroid Prime Hunters game files. Put a valid paths.txt
          beside the binary pointing at those files. No game data is included
          in this package. Maps come from maprotation.txt, written beside the
          binary on first run.

          The server lists itself on 51.161.113.128 so that players can find it
          in the launcher's server browser. Pass -nomaster to stay private, or
          -master HOST to use a different directory.

          To run a directory of your own:

            ./ProjectPrime -masterserver -port 27889

          tools/systemd/ in the source has unit files to run this under
          systemd; deploy-server.sh automates that end to end for the ARM64
          build, and the same units work here with the RID changed.
          NOTE
          cp SERVER.md publish/linux-x64-server/SERVER.md
          python3 tools/write-release-manifest.py publish/linux-x64-server
          ( cd publish/linux-x64-server && tar czf "../../dist/ProjectPrime-$TAG-server-linux-x64.tar.gz" . )

          cp LICENSE publish/win-x64-server/ 2>/dev/null || true
          cat > publish/win-x64-server/SERVER.txt <<'NOTE'
          Project Prime dedicated server, for Windows.

          From a Command Prompt or PowerShell, in this folder:

            ProjectPrimeServer.exe -server -port 27888 -players 8 -servername "My server"

          This server runs the match authoritatively and therefore requires
          your extracted Metroid Prime Hunters game files. Put a valid paths.txt
          beside ProjectPrimeServer.exe pointing at those files. No game data is
          included in this package. Maps come from maprotation.txt, written
          beside the binary on first run.

          This is a console program, unlike ProjectPrime.exe: the window stays until
          the server stops, Ctrl+C shuts it down cleanly, and its exit code is
          reported, so it can be run under a service supervisor (NSSM, or
          sc.exe with a wrapper) the way the Linux build runs under systemd.
          Double-clicking it works too and opens a window of its own.

          Windows will ask once whether to allow it through the firewall.
          Nobody outside this machine can reach the server until that is
          allowed for UDP on the port above, and until the router forwards it.

          The server lists itself on 51.161.113.128 so that players can find it
          in the launcher's server browser. Pass -nomaster to stay private, or
          -master HOST to use a different directory.

          To run a directory of your own:

            ProjectPrimeServer.exe -masterserver -port 27889

          To see what is up right now:

            ProjectPrimeServer.exe -servers
          NOTE
          cp SERVER.md publish/win-x64-server/SERVER.md
          python3 tools/write-release-manifest.py publish/win-x64-server
          ( cd publish/win-x64-server && zip -qr "../../dist/ProjectPrime-$TAG-server-win-x64.zip" . )

          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop
          path: dist/*
          if-no-files-found: error

  macos-release:
    needs: [resolve, prepare-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-game-${{ hashFiles('global.json', 'src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-game-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: prepared-maps
          path: maps
      - name: check sources
        run: |
          set -euo pipefail
          tools/check-no-game-assets.sh
          tools/check-maps-shipped.sh
      - name: publish and verify macOS release
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          tools/wgpu/build-native.sh "$RID"
          tools/ktx/build-native.sh "$RID"
          dotnet publish src/MphRead/MphRead.csproj -c Release -r "$RID" \
            -p:Version="$VERSION" -p:InformationalVersion="$VERSION" \
            --self-contained true -p:PublishSingleFile=true -o "publish/$RID"
          chmod +x "publish/$RID/ProjectPrime"
          "publish/$RID/ProjectPrime" -renderbackendprobe -renderer metal
          tools/check-macos-modern-vulkan.sh "publish/$RID/ProjectPrime"
          tools/sign-macos.sh "publish/$RID"
          tools/check-macos-build.sh "publish/$RID" "$RID"
          tools/run-macos-smoke.sh "publish/$RID" "$RID"
          python3 tools/test-compatibility-smoke.py "publish/$RID/ProjectPrime"
          tools/check-no-game-assets.sh "publish/$RID"
          tools/check-maps-shipped.sh "publish/$RID"
          tools/package-macos.sh "publish/$RID" dist "$RID" "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: dist/*.tar.gz
          if-no-files-found: error

  v47-release-updater-acceptance:
    name: Published v0.1.46 to v0.1.47 binary update and relaunch
    needs: [resolve, package-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: release-desktop
          path: dist
      - name: exercise the actual release helper and transactional installer
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v46" "$RUNNER_TEMP/v47"
          curl --retry 3 --fail --location \
            https://github.com/AntiNotAnti/Project-Prime/releases/download/v0.1.46/ProjectPrime-v0.1.46-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/v46.tar.gz"
          printf '2ad56d54ca274a5d310899e260e83c76242cb46bc179c75e456d90eb01d5f77d  %s\n' "$RUNNER_TEMP/v46.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/v46.tar.gz" -C "$RUNNER_TEMP/v46"
          tar -xzf "dist/ProjectPrime-$TAG-linux-x64.tar.gz" -C "$RUNNER_TEMP/v47"
          dotnet run --project tools/updatecheck -c Release -- --candidate-release-swap \
            "$RUNNER_TEMP/v46" "$RUNNER_TEMP/v47"

  publish:
    needs: [resolve, package-release, release-android, macos-release, v47-release-updater-acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      # Publish directly to this public repository. The built-in GITHUB_TOKEN
      # has contents: write above, so release creation and asset uploads need no
      # personal access token or second repository.
      #
      # Tag pushes publish automatically. A manual run can turn "publish" off
      # to leave a draft for inspection. Releases are stable, not prereleases,
      # because releases/latest intentionally skips prereleases.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PUBLISH_NOW: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        run: |
          set -euo pipefail
          visibility=$(gh repo view "$REPOSITORY" --json visibility --jq .visibility)
          if [ "$visibility" != "PUBLIC" ]; then
            echo "::error::$REPOSITORY must remain public so clients can check releases without a GitHub credential."
            exit 1
          fi

          cat > notes.md <<'NOTE'
          **Project Prime**

          You bring your own Metroid Prime Hunters cartridge dump. No game data is included here
          and none is downloaded.

          - **Windows** -- the `win-x64` zip, run `ProjectPrime.exe`
          - **Linux** -- the `.tar.gz`, run `./ProjectPrime -launcher`
          - **macOS** -- the matching `.tar.gz`
          - **Android** -- the `.apk`
          - **Dedicated server** -- the `server-` package for the server OS/architecture

          The launcher checks this release channel on startup. Windows/Linux desktop builds
          and Android can install a matching package in-app; macOS opens this release page.
          NOTE

          # The v0.1.47 hotfix deliberately starts from v0.1.46, NOT v0.1.52.
          # A generated comparison against the later stable release would be
          # misleading, so publish explicit hotfix notes for this one tag.
          if [ "$TAG" = "v0.1.47" ]; then
            cat >> notes.md <<'HOTFIX'

          ---

          ## v0.1.47 compatibility hotfix (based on v0.1.46)

          This is v0.1.46 gameplay/UI with a backported Windows + Linux desktop
          updater. It does not include the v0.1.52 Studio/RmlUi migration.

          - Installs releases using a detached copy of the **currently installed**
            executable instead of executing the incoming release before its files
            have been installed.
          - Requires a live helper acknowledgement before closing the launcher.
          - Uses a verified, journaled file transaction, rollback after failure,
            longer parent shutdown wait, retries for transient Windows sharing
            violations and persistent updater failure logging.
          - Protects user settings/maps/replays and prevents an old standalone
            release from replacing a newer paired Game + Studio installation.

          The withdrawn **v0.1.52 desktop packages were malformed**:
          Windows lacked hidden Game/Studio compatibility metadata, while
          Linux carried an internal updater lock in its file manifest.
          v0.1.47 rejects both failure classes before closing the game.
          Future paired releases must pass fixed packaging checks.

          **v0.1.47 is the next stable release after v0.1.46.** Once
          published, the launcher will offer this hotfix automatically.
          Gameplay/UI are unchanged from v0.1.46; this release concentrates
          on updater reliability, recovery and safe future upgrades.

          On Windows and Linux, failed updates log to
          `logs/ProjectPrime-updater.log` in the game installation directory.
          HOTFIX
          else
            CHANGES=$(gh api -X POST \
              "repos/$REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body 2>/dev/null || true)
            if [ -n "$CHANGES" ]; then
              printf '\n---\n\n%s\n' "$CHANGES" >> notes.md
            else
              echo "::warning::No changelog could be generated for $TAG."
            fi
          fi

          if [ "$TAG" = "v0.1.47" ] && [ "$PUBLISH_NOW" = "true" ]; then
            # Never downgrade the latest channel if another newer public
            # release appears while the hotfix build is running.
            current_latest=$(gh api "repos/$REPOSITORY/releases/latest" --jq '.tag_name')
            if [ "$current_latest" != "v0.1.46" ] && [ "$current_latest" != "v0.1.47" ]; then
              echo "::error::Unexpected latest $current_latest; refuse to supersede a newer published release."
              exit 1
            fi
          fi

          if gh release view "$TAG" \
              --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber \
              --repo "$REPOSITORY"
            gh release edit "$TAG" \
              --repo "$REPOSITORY" \
              --title "Project Prime $TAG" --notes-file notes.md
            if [ "$PUBLISH_NOW" = "true" ]; then
              gh release edit "$TAG" \
                --repo "$REPOSITORY" --draft=false
            fi
          else
            args=(release create "$TAG" dist/* --repo "$REPOSITORY" \
              --verify-tag --title "Project Prime $TAG" --notes-file notes.md)
            if [ "$PUBLISH_NOW" != "true" ]; then
              args+=(--draft)
            fi
            gh "${args[@]}"
          fi
          if [ "$TAG" = "v0.1.47" ] && [ "$PUBLISH_NOW" = "true" ]; then
            # v0.1.52 was withdrawn, leaving v0.1.46 as releases/latest.
            # The reviewed v0.1.47 hotfix becomes the next stable channel,
            # but never replaces a newer published release (guarded above).
            release_id=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq '.id')
            gh api -X PATCH "repos/$REPOSITORY/releases/$release_id" \
              -f make_latest=true >/dev/null
            latest=$(gh api "repos/$REPOSITORY/releases/latest" --jq '.tag_name')
            if [ "$latest" != "$TAG" ]; then
              echo "::error::Expected $TAG as the latest published release; got $latest."
              exit 1
            fi
          fi
